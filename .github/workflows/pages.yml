# DE: Veröffentlicht die Web-IDE mit GitHub Pages (in den Repo-Einstellungen Pages auf "GitHub Actions" stellen). EN: publishes the web IDE with GitHub Pages (set Pages to "GitHub Actions" in the repo settings).
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install && npm run build
      - run: |
          mkdir _site
          cp -r web dist plugins runtimes src _site/ 2>/dev/null || true
          echo '<meta http-equiv="refresh" content="0; url=web/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
